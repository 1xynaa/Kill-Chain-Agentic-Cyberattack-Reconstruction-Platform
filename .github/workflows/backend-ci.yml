name: Backend CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Validate dependency resolution
        run: python -m pip check

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run test suite
        run: python -m pytest -q

      - name: Run terminal smoke investigation
        run: python -m backend.tui tests/fixtures/auth.log --max-calls 4 | tee /tmp/kill-chain-tui.log && grep -q 'Exploitation' /tmp/kill-chain-tui.log

  package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build distribution
        run: python -m pip install build && python -m build
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: kill-chain-backend-dist
          path: dist/
